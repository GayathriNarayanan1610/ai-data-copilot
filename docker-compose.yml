services:
  ui:
    build: .
    ports:
      - "8501:8501"
    environment:
      LLM_MODE: ${LLM_MODE:-mock}      # set to 'gemini' + GOOGLE_API_KEY to match prod
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      DB_PATH: /app/data/copilot.db
      PORT: "8501"
    volumes:
      - copilot-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Optional local model backend. Enable with:  docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  copilot-data:
  ollama-data:
